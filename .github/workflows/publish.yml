name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    # The Marketplace trusted publishing policy only accepts this environment.
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run test:unit
      - run: xvfb-run -a npm run test:integration
      - run: npx vsce package --no-dependencies --out extension.vsix
      - name: Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath extension.vsix
      - name: Open VSX
        run: npx ovsx publish extension.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
